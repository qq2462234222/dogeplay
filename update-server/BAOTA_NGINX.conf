# 宝塔 Linux / Nginx 站点配置片段
# 一般默认静态站点已经可以直接提供 manifest.json 和 ZIP；只有下载或缓存异常时再加入对应 location。

location = /manifest.json {
    default_type application/json;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Access-Control-Allow-Origin "*" always;
}

location ~* \.zip$ {
    default_type application/zip;
    add_header Content-Disposition "attachment";
    add_header Access-Control-Allow-Origin "*" always;
}

# 可选：将 /download 直接作为附件下载入口。文件已上传后，
# 把下列 location 放到此站点现有的 server { ... } 内并重载 Nginx。
# 不添加时，download/index.html 也会自动跳转到 dogeplay 安装包。
location = /download {
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="dogeplay-setup.exe"' always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /files/dogeplay-setup.exe =404;
}

location = /download/ {
    return 302 /download;
}
